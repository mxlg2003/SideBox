name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish .NET Win-x64 Binaries
        run: .\pack\publish.ps1

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          if (-not $tag) { $tag = "v1.0.1" }
          $rawVer = $tag.TrimStart('v').TrimStart('V')
          $iscc = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } `
                  elseif (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe") { "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" } `
                  elseif (Test-Path "${env:ProgramFiles}\Inno Setup 6\iscc.exe") { "${env:ProgramFiles}\Inno Setup 6\iscc.exe" } `
                  else { throw "iscc.exe not found" }
          Write-Host "Using Inno Setup compiler: $iscc with version $rawVer"
          & $iscc "/DMyAppVersion=$rawVer" pack\WinDock.iss

      - name: Generate Checksums & latest.json
        id: manifest
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ inputs.tag }}" }
          if (-not $tag) { $tag = "v1.0.1" }
          $rawVer = $tag.TrimStart('v').TrimStart('V')
          $setupPath = "pack\output\SideBox-setup.exe"
          
          if (-not (Test-Path $setupPath)) {
            throw "Installer not found at $setupPath"
          }

          # 1. Compute SHA256
          $hash = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "pack\output\SideBox-setup.exe.sha256" -Value $hash -NoNewline

          # 2. Build latest.json manifest for serverless updater
          $manifest = [ordered]@{
            version = $rawVer
            min_supported_version = "1.0.0"
            download_url = "https://github.com/mxlg2003/SideBox/releases/download/$tag/SideBox-setup.exe"
            sha256 = $hash
            changelog = "Release $tag"
            release_page = "https://github.com/mxlg2003/SideBox/releases/tag/$tag"
            mandatory = $false
          }
          $json = $manifest | ConvertTo-Json -Depth 5
          Set-Content -Path "pack\output\latest.json" -Value $json -Encoding utf8

          Write-Host "Generated latest.json with SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: SideBox ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            pack/output/SideBox-setup.exe
            pack/output/SideBox-setup.exe.sha256
            pack/output/latest.json
